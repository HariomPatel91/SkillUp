<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Master</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">

    <!-- LEVEL SCREEN -->
    <div id="levelScreen">
        <h1>🌍 GK Master</h1>
        <p>Learn General Knowledge by playing!</p>

        <h2>Choose Your Level</h2>

        <div class="levels">
            <button class="easy" onclick="startGame('easy')">🟢 Easy</button>
            <button class="medium" onclick="startGame('medium')">🟡 Medium</button>
            <button class="hard" onclick="startGame('hard')">🔴 Hard</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="hidden">

        <h1 id="levelTitle"></h1>

        <div class="progress">
            Question <span id="questionNumber">1</span> / 5
        </div>

        <div class="score">
            Score: <span id="score">0</span>
        </div>

        <div class="question-box">
            <h2 id="question"></h2>
            <div id="answers"></div>
        </div>

        <button class="next-btn" onclick="nextQuestion()">
            Next Question
        </button>

    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="hidden">

        <h1>🎉 Quiz Completed!</h1>

        <p>Your Final Score</p>

        <h2 id="finalScore"></h2>

        <p id="resultMessage"></p>

        <button class="restart-btn" onclick="restartGame()">
            🔄 Play Again
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
