<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Number Rush</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="game-container">

        <div class="top-section">

            <div>
                <h1>🔢 Number Rush</h1>

                <p>
                    Merge numbers and reach 2048!
                </p>
            </div>

            <div class="score-box">

                <span>Score</span>

                <strong id="score">
                    0
                </strong>

            </div>

        </div>


        <div class="best-score">

            Best:
            <span id="bestScore">
                0
            </span>

        </div>


        <div class="game-board"
             id="gameBoard">

            <!-- 16 Tiles -->

            <div class="tile"
                 id="tile-0"></div>

            <div class="tile"
                 id="tile-1"></div>

            <div class="tile"
                 id="tile-2"></div>

            <div class="tile"
                 id="tile-3"></div>


            <div class="tile"
                 id="tile-4"></div>

            <div class="tile"
                 id="tile-5"></div>

            <div class="tile"
                 id="tile-6"></div>

            <div class="tile"
                 id="tile-7"></div>


            <div class="tile"
                 id="tile-8"></div>

            <div class="tile"
                 id="tile-9"></div>

            <div class="tile"
                 id="tile-10"></div>

            <div class="tile"
                 id="tile-11"></div>


            <div class="tile"
                 id="tile-12"></div>

            <div class="tile"
                 id="tile-13"></div>

            <div class="tile"
                 id="tile-14"></div>

            <div class="tile"
                 id="tile-15"></div>

        </div>


        <div class="controls">

            <button id="upBtn">
                ⬆️
            </button>

            <div>

                <button id="leftBtn">
                    ⬅️
                </button>

                <button id="downBtn">
                    ⬇️
                </button>

                <button id="rightBtn">
                    ➡️
                </button>

            </div>

        </div>


        <button id="restartBtn">
            🔄 New Game
        </button>


        <div class="game-over hidden"
             id="gameOver">

            <div class="game-over-box">

                <div class="emoji">
                    🏆
                </div>

                <h2>
                    Game Over!
                </h2>

                <p id="finalScore">
                    Score: 0
                </p>

                <button id="playAgainBtn">
                    🎮 Play Again
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
