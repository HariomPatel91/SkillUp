<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <div class="header">

            <h1>🧠 Memory Match</h1>

            <p>Match all the pairs!</p>

        </div>


        <div class="stats">

            <div class="stat">
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="stat">
                <span>Matches</span>
                <strong id="matches">0</strong>
            </div>

            <div class="stat">
                <span>Time</span>
                <strong id="time">0s</strong>
            </div>

        </div>


        <div class="game-board" id="gameBoard">

        </div>


        <button id="restartBtn">
            🔄 Restart Game
        </button>


        <div class="win-message hidden" id="winMessage">

            <div class="win-box">

                <div class="trophy">🏆</div>

                <h2>You Won!</h2>

                <p id="finalStats"></p>

                <button id="playAgainBtn">
                    🎮 Play Again
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
